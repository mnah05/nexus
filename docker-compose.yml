services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-node1
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - NODE_ID=node1:8001
      - PEERS=node2:8002,node3:8003
    volumes:
      - node1-data:/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-node2
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - NODE_ID=node2:8002
      - PEERS=node1:8001,node3:8003
    volumes:
      - node2-data:/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-node3
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - NODE_ID=node3:8003
      - PEERS=node1:8001,node2:8002
    volumes:
      - node3-data:/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

networks:
  nexus-net:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
